name: sca

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sca.yml"
  push:
    branches:
      - main
      - ganesh-dev
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sca.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Export resolved dependencies
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/requirements.txt

      - name: pip-audit
        run: uvx pip-audit --strict --requirement /tmp/requirements.txt
