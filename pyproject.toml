[project]
name = "edgar-analyst"
version = "0.3.0"
description = "RAG over public SEC EDGAR filings using Python, LangChain, and LangGraph"
authors = [
    { name = "Ganesh Babu", email = "ganesh@ganeshbabu.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.98.1",
    "beautifulsoup4>=4.14.3",
    "click>=8.3.3",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain>=1.2.17",
    "langchain-anthropic>=1.4.3",
    "langchain-postgres>=0.0.17",
    "langchain-voyageai>=0.3.3",
    "langgraph>=1.1.10",
    "lxml>=6.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
edgar-analyst = "edgar_analyst.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/edgar_analyst/ingestion/parser.py" = ["RUF001", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain.*",
    "langchain_text_splitters.*",
    "langchain_voyageai.*",
    "bs4.*",
    "lxml.*",
    "tiktoken.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: live end-to-end test; gated on INTEGRATION env var",
]
