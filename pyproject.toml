[project]
name = "edgar-analyst"
version = "0.1.0"
description = "RAG over public SEC EDGAR filings using Python, LangChain, and LangGraph"
authors = [
    { name = "Ganesh Babu", email = "ganesh@ganeshbabu.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.98.1",
    "click>=8.3.3",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain>=1.2.17",
    "langchain-anthropic>=1.4.3",
    "langchain-postgres>=0.0.17",
    "langchain-voyageai>=0.3.3",
    "langgraph>=1.1.10",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
edgar-analyst = "edgar_analyst.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
