services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edgar-analyst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgar_analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-edgar_analyst}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgar_analyst} -d ${POSTGRES_DB:-edgar_analyst}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
